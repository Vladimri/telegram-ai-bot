name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: bot
          POSTGRES_PASSWORD: bot
          POSTGRES_DB: telegram_ai_bot_test
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U bot"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://bot:bot@localhost:55432/telegram_ai_bot_test
      BOT_TOKEN: ci-token
      DATABASE_URL: postgresql+asyncpg://bot:bot@localhost:55432/telegram_ai_bot_test
      OLLAMA_BASE_URL: http://localhost:11434
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: mypy bot
      - run: pytest
